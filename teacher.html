<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Docente - LinguaStep A1</title>
</head>
<body>

  <header>
    <h1>LinguaStep A1</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="login.html">Acceso</a></li>
        <li><a href="student.html">Estudiante</a></li>
        <li><a href="teacher.html">Profesor</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section>
      <h2>Crear lección</h2>
      <form action="#" method="post">
        <p>
          <label for="unidad">Unidad (1 a 4)</label><br>
          <input type="number" id="unidad" name="unidad" min="1" max="4" required>
        </p>
        <p>
          <label for="titulo">Título</label><br>
          <input type="text" id="titulo" name="titulo" required>
        </p>
        <p>
          <label for="resumen">Resumen</label><br>
          <textarea id="resumen" name="resumen" rows="3" required></textarea>
        </p>
        <p>
          <label for="publicada">¿Publicada?</label>
          <select id="publicada" name="publicada">
            <option value="si">Sí</option>
            <option value="no">No</option>
          </select>
        </p>
        <button type="submit">Guardar lección</button>
      </form>
    </section>

    <section>
      <h2>Añadir pregunta</h2>
      <form action="#" method="post">
        <p>
          <label for="enunciado">Enunciado</label><br>
          <input type="text" id="enunciado" name="enunciado" required>
        </p>
        <p>
          <label for="respuesta">Respuesta correcta</label><br>
          <input type="text" id="respuesta" name="respuesta" required>
        </p>
        <button type="submit">Guardar pregunta</button>
      </form>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 LinguaStep A1 - UTP</p>
  </footer>

</body>
</html>
