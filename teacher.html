<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Docente - LinguaStep A1</title>
</head>
<body>

    <header>
        <h1>Panel del Profesor</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="login.html">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="resumen">
            <h2>Métricas</h2>
            <p>Estudiantes: 15 | Lecciones: 2</p>
        </section>

        <section id="gestion-leccion">
            <h2>Crear Lección</h2>
            <form action="#" method="POST">
                <label for="unidad">Unidad:</label><br>
                <input type="number" id="unidad" name="unidad" required><br><br>

                <label for="titulo">Título:</label><br>
                <input type="tex" id="titulo" name="titulo" required><br><br>

                <button type="submit">Guardar Lección</button>
            </form>
        </section>

        <section id="gestion-pregunta">
            <h2>Añadir Ejercicio</h2>
            <form action="#">
                <label for="pregunta">Pregunta:</label><br>
                <input type="text" id="pregunta" name="pregunta" required><br><br>

                <label for="respuesta">Respuesta Correcta:<br>
                <input type="text" id="respuesta" name="respuesta" required><br><br>

                <button type="submit">Guardar Ejercicio</button>
            </form>
        </section>

    </main>
</body>
</html>
