<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>

    <main>
        
        <section id="presentacion">
            <header>
                <h1>LinguaStep A1</h1>
            </header>
            
            <img src="assets/imagen_index.png" alt="Estudiante aprendiendo idiomas" width="300">

            <article>
                <h2>Bridge the gap to fluency.</h2>
                <p>Step-by-step English learning designed specifically for absolute beginners. Start your journey today.</p>
            </article>
        </section>

        <section id="autenticacion">
            
            <nav>
                <ul>
                    <li><a href="login.html">Iniciar sesión</a></li>
                    <li><a href="#">Registrarse</a></li>
                </ul>
            </nav>

            <header>
                <h2>Bienvenido de nuevo</h2>
                <p>Por favor, ingresa tus datos para continuar.</p>
            </header>

            <form action="#" method="POST">
                
                <label for="correo">Correo electrónico</label><br>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                
                <br><br>

                <label for="password">Contraseña</label><br>
                <input type="password" id="password" name="password" placeholder="********" required>
                
                <br><br>

                <button type="submit">Ingresar</button>
                
            </form>

        </section>

    </main>

</body>
</html>
